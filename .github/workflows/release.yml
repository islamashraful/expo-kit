name: Release

# On every push to main:
# - changesets waiting → open or update the "Version packages" pull request
# - no changesets (e.g. that pull request was just merged) → publish new versions to npm
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # version commit and git tags
      pull-requests: write # "Version packages" pull request
      id-token: write # npm trusted publishing, no token needed
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@latest

      # postinstall builds every package
      - run: bun install --frozen-lockfile

      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run version-packages
          commit-message: Version packages
          pr-title: Version packages

      - if: steps.changesets.outputs.has-changesets == 'false'
        run: bun run release
